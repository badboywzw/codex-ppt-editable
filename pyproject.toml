[project]
name = "codex-ppt"
version = "0.3.0"
description = "Producer-style AI slide deck skill — generate 16:9 PDF decks or multi-layer editable PPTX presentations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-q"
